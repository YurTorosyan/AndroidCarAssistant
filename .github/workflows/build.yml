name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.7
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o gradle.zip https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip || curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Download Vosk Russian model
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q m.zip
          rm -rf app/src/main/assets/model-ru
          mkdir -p app/src/main/assets
          mv vosk-model-small-ru-0.22 app/src/main/assets/model-ru

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarVoice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
